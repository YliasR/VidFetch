<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 314">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a0e"/>
      <stop offset="1" stop-color="#120a05"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ff8c42" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff8c42" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="164" height="314" fill="url(#bg)"/>
  <rect width="164" height="314" fill="url(#glow)"/>

  <!-- app icon -->
  <image href="icon.svg" x="22" y="24" width="120" height="120"/>

  <!-- wordmark -->
  <text x="82" y="200" text-anchor="middle" font-family="Segoe UI" font-weight="700" font-size="28" fill="#ffedd9">VidFetch</text>
  <text x="82" y="222" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#d9b29a">A sleek yt-dlp GUI</text>

  <!-- accent chevrons -->
  <g fill="none" stroke="#ff8c42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="70,252 82,262 94,252" opacity="0.9"/>
    <polyline points="70,268 82,278 94,268" opacity="0.5"/>
    <polyline points="70,284 82,294 94,284" opacity="0.25"/>
  </g>
</svg>
