<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1a0e"/>
      <stop offset="1" stop-color="#120a05"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8c42" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff8c42" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- app icon -->
  <image href="icon.svg" x="60" y="26" width="248" height="248"/>

  <!-- wordmark + tagline -->
  <text x="340" y="150" font-family="Segoe UI" font-weight="700" font-size="84" fill="#ffedd9">VidFetch</text>
  <text x="344" y="205" font-family="Segoe UI" font-size="28" fill="#d9b29a">Download anything. No terminal required.</text>

  <!-- accent bar -->
  <rect x="344" y="228" width="120" height="6" rx="3" fill="#ff8c42"/>
</svg>
