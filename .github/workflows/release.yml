name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract changelog from tag
        id: changelog
        shell: bash
        run: |
          # Pull the annotation body from the pushed tag. Falls back to a
          # minimal message if the tag is lightweight (no -m on `git tag`).
          MSG=$(git tag -l --format='%(contents:body)' "${{ github.ref_name }}")
          if [ -z "$MSG" ]; then
            SUBJECT=$(git tag -l --format='%(contents:subject)' "${{ github.ref_name }}")
            MSG="$SUBJECT"
          fi
          if [ -z "$MSG" ]; then
            MSG="Release ${{ github.ref_name }}."
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$MSG"
            echo ''
            echo '---'
            echo ''
            echo 'This is an early alpha. Expect bugs and missing features — please report any issues you hit.'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — leave secrets unset until a keypair is generated.
          # When set, tauri-action signs the NSIS bundle and emits latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VidFetch ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          # Auto-publish as "latest" so the updater endpoint
          # (/releases/latest/download/latest.json) resolves. Drafts are
          # invisible, and the "Pre-release" flag excludes a release from
          # /latest/ redirects even when published. Alpha status is made
          # clear via the changelog body instead.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
